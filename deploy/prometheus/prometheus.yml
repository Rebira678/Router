global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "router"
    # Inside docker-compose, containers resolve each other by service name.
    # The router exposes metrics on :9095 inside the container.
    static_configs:
      - targets: ["router:9095"]
        labels:
          service: "ai-gateway"